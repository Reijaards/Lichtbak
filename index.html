<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141518">
<meta name="description" content="Lichtbak: foto's bewerken op je telefoon en pc, ook offline. Je foto's blijven op je eigen apparaat.">
<title>Lichtbak</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Playfair+Display:wght@700&family=Caveat:wght@700&family=Bebas+Neue&family=Courier+Prime:wght@700&display=swap">
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>

<section id="library" class="view">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Lichtbak</h1></div>
    <div class="actions">
      <button id="installBtn" class="btn" hidden>Installeren</button>
      <button id="selectBtn" class="btn">Selecteren</button>
      <a id="videoBtn" class="btn icon" href="video.html" aria-label="Video bewerken" title="Video bewerken"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3z"/></svg></a>
      <button id="camBtn" class="btn icon" aria-label="Camera" title="Camera"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></svg></button>
      <button id="importBtn" class="btn primary"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Nieuw</span></button>
    </div>
    <div class="menu" id="addMenu" hidden>
      <button data-add="photos">Foto's toevoegen</button>
      <button data-add="camera">Camera (in Lichtbak)</button>
      <button data-add="native">Telefooncamera-app</button>
      <button data-add="blank">Nieuw leeg document (lagen)</button>
      <button data-add="video">Video bewerken</button>
      <button data-add="sample">Voorbeeldfoto toevoegen</button>
    </div>
  </header>
  <div class="lib-scroll" id="libScroll">
    <div class="lib-meta" id="libMeta"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <div class="empty-art" aria-hidden="true"><span></span><span></span><span></span></div>
      <h2>Je bibliotheek is nog leeg</h2>
      <p>Voeg foto's toe vanaf je telefoon of pc. Ze worden alleen op dit apparaat bewaard. Je bewerkingen ook, dus je kunt later altijd verder.</p>
      <div class="row center">
        <button class="btn primary" id="emptyImport">Foto's toevoegen</button>
        <button class="btn" id="emptyCam">Foto maken</button>
        <button class="btn" id="sampleBtn">Probeer de voorbeeldfoto</button>
      </div>
    </div>
  </div>
  <div class="selbar" id="selbar" hidden>
    <div class="selinfo"><span id="selCount">0 geselecteerd</span><button class="link" id="selAll">Alles</button></div>
    <div class="selactions">
      <button class="btn" id="selPreset">Preset</button>
      <button class="btn" id="selPaste">Plakken</button>
      <button class="btn" id="selExport">Exporteren</button>
      <button class="btn danger" id="selDelete">Verwijderen</button>
      <button class="btn primary" id="selDone">Klaar</button>
    </div>
  </div>
  <div class="dropzone" id="dropzone" hidden>Laat los om toe te voegen</div>
</section>

<section id="editor" class="view" hidden>
  <header class="top ed-top">
    <button class="btn icon ghost" id="backBtn" aria-label="Terug naar bibliotheek"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ed-title"><span id="edName"></span><span id="edPos" class="muted"></span></div>
    <div class="actions">
      <button class="btn icon ghost wide-only" id="prevBtn" aria-label="Vorige foto"><svg viewBox="0 0 24 24"><path d="M14 7l-5 5 5 5"/></svg></button>
      <button class="btn icon ghost wide-only" id="nextBtn" aria-label="Volgende foto"><svg viewBox="0 0 24 24"><path d="M10 7l5 5-5 5"/></svg></button>
      <button class="btn icon ghost" id="undoBtn" aria-label="Ongedaan maken"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="btn icon ghost" id="redoBtn" aria-label="Opnieuw"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
      <button class="btn icon ghost" id="compareBtn" aria-label="Ingedrukt houden voor origineel" title="Ingedrukt houden voor het origineel (toets \)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg></button>
      <button class="btn icon ghost" id="moreBtn" aria-label="Meer opties"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
      <button class="btn primary" id="exportBtn"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span class="wide-only">Exporteren</span></button>
    </div>
    <div class="menu" id="menu" hidden>
      <button data-act="prev">Vorige foto</button>
      <button data-act="next">Volgende foto</button>
      <hr>
      <button data-act="copy">Instellingen kopiëren…</button>
      <button data-act="paste">Instellingen plakken</button>
      <hr>
      <button data-act="layers">Openen in Bewerken (lagen)</button>
      <hr>
      <button data-act="reset" class="danger-text">Alle bewerkingen herstellen</button>
    </div>
  </header>
  <div class="ed-main">
    <div class="stage" id="stage">
      <div class="wrap" id="wrap">
        <canvas id="gl"></canvas>
        <canvas id="ov"></canvas>
        <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="crop" id="cropBox" hidden>
          <span class="h" data-h="nw"></span><span class="h" data-h="ne"></span><span class="h" data-h="sw"></span><span class="h" data-h="se"></span>
          <span class="h" data-h="n"></span><span class="h" data-h="s"></span><span class="h" data-h="e"></span><span class="h" data-h="w"></span>
        </div>
      </div>
      <div class="badge" id="origBadge" hidden>Origineel</div>
      <div class="badge right" id="zoomBadge" hidden>100%</div>
      <div class="loading" id="loading" hidden>Laden…</div>
    </div>
    <aside class="side" id="side">
      <canvas id="histo" class="histo" width="512" height="128" aria-label="Histogram"></canvas>
      <div class="panel" id="panel"></div>
      <nav class="tools" id="tools" aria-label="Gereedschappen"></nav>
    </aside>
  </div>
</section>

<section id="bewerk" class="view" hidden>
  <header class="top ed-top">
    <button class="btn icon ghost" id="bwBack" aria-label="Terug naar bibliotheek"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ed-title"><span id="bwName"></span><span id="bwSize" class="muted"></span></div>
    <div class="actions">
      <button class="btn icon ghost" id="bwUndo" aria-label="Ongedaan maken"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="btn icon ghost" id="bwRedo" aria-label="Opnieuw"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
      <button class="btn ghost small zoombtn" id="bwZoom" title="Tik: 100% of passend">100%</button>
      <button class="btn icon ghost wide-only" id="bwFit" aria-label="Passend in beeld"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="btn icon ghost" id="bwMore" aria-label="Documentopties"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
      <button class="btn primary" id="bwExport"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span class="wide-only">Exporteren</span></button>
    </div>
  </header>
  <div class="bw-main">
    <nav class="bw-tools" id="bwTools" aria-label="Gereedschappen"></nav>
    <div class="bw-stage" id="bwStage" data-tool="brush"><canvas id="bwView"></canvas></div>
    <aside class="side bw-side" id="bwSide"></aside>
  </div>
  <input type="color" id="bwColorIn" class="sr" tabindex="-1" aria-hidden="true">
</section>

<section id="camera" class="view cam" hidden>
  <div class="cam-view" id="camView">
    <div class="cam-frame" id="camFrame">
      <video id="camVideo" playsinline muted></video>
      <canvas id="camLive" hidden></canvas>
      <div class="cam-grid" id="camGridLines"></div>
    </div>
    <div class="cam-level" id="camLevel" hidden></div>
    <div class="cam-focus" id="camFocus" hidden></div>
    <div class="cam-count" id="camCount" hidden></div>
    <div class="cam-flash" id="camFlash" hidden></div>
    <div class="cam-state" id="camState" hidden></div>
  </div>
  <div class="cam-top">
    <button class="cam-ic" id="camClose" aria-label="Camera sluiten"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="cam-tg">
      <button class="cam-pill" id="camGrid">Raster</button>
      <button class="cam-pill" id="camLevelBtn">Waterpas</button>
      <button class="cam-pill" id="camTimer">Timer</button>
      <button class="cam-pill" id="camTorch" hidden>Lamp</button>
    </div>
  </div>
  <div class="cam-bottom">
    <div class="cam-sliders">
      <label class="cam-sl" id="camZoomBox" hidden><span>Zoom</span><input type="range" id="camZoom"><output id="camZoomOut"></output></label>
      <label class="cam-sl" id="camExpBox" hidden><span>Belichting</span><input type="range" id="camExp"><output id="camExpOut">0</output></label>
    </div>
    <div class="cam-presets chips" id="camPresets"></div>
    <div class="cam-row">
      <button class="cam-last" id="camLast" hidden aria-label="Laatste foto openen"><img alt=""><span></span></button>
      <span class="cam-spacer" id="camLastSpacer"></span>
      <button class="cam-shutter" id="camShutter" aria-label="Foto maken"></button>
      <div class="cam-side">
        <button class="cam-ic" id="camFlip" aria-label="Wissel camera"><svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 14-3l2 2"/><path d="M20 4v4h-4"/><path d="M20 15a8 8 0 0 1-14 3l-2-2"/><path d="M4 20v-4h4"/></svg></button>
        <button class="cam-ic" id="camNative" aria-label="Telefooncamera-app gebruiken" title="Telefooncamera-app"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></svg></button>
      </div>
    </div>
  </div>
</section>
<input type="file" id="nativeCam" accept="image/*" capture="environment" hidden>

<div class="dlg" id="dlg" hidden><div class="card" id="dlgCard" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
</body>
</html>
