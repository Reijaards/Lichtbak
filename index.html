<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141518">
<meta name="description" content="Lichtbak: foto's bewerken op je telefoon en pc, ook offline. Je foto's blijven op je eigen apparaat.">
<title>Lichtbak</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Playfair+Display:wght@700&family=Caveat:wght@700&family=Bebas+Neue&family=Courier+Prime:wght@700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>

<section id="library" class="view">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Lichtbak</h1></div>
    <div class="actions">
      <button id="installBtn" class="btn" hidden>Installeren</button>
      <button id="selectBtn" class="btn">Selecteren</button>
      <button id="importBtn" class="btn primary"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Foto's</span></button>
    </div>
  </header>
  <div class="lib-scroll" id="libScroll">
    <div class="lib-meta" id="libMeta"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <div class="empty-art" aria-hidden="true"><span></span><span></span><span></span></div>
      <h2>Je bibliotheek is nog leeg</h2>
      <p>Voeg foto's toe vanaf je telefoon of pc. Ze worden alleen op dit apparaat bewaard. Je bewerkingen ook, dus je kunt later altijd verder.</p>
      <div class="row center">
        <button class="btn primary" id="emptyImport">Foto's toevoegen</button>
        <button class="btn" id="sampleBtn">Probeer de voorbeeldfoto</button>
      </div>
    </div>
  </div>
  <div class="selbar" id="selbar" hidden>
    <div class="selinfo"><span id="selCount">0 geselecteerd</span><button class="link" id="selAll">Alles</button></div>
    <div class="selactions">
      <button class="btn" id="selPreset">Preset</button>
      <button class="btn" id="selPaste">Plakken</button>
      <button class="btn" id="selExport">Exporteren</button>
      <button class="btn danger" id="selDelete">Verwijderen</button>
      <button class="btn primary" id="selDone">Klaar</button>
    </div>
  </div>
  <div class="dropzone" id="dropzone" hidden>Laat los om toe te voegen</div>
</section>

<section id="editor" class="view" hidden>
  <header class="top ed-top">
    <button class="btn icon ghost" id="backBtn" aria-label="Terug naar bibliotheek"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ed-title"><span id="edName"></span><span id="edPos" class="muted"></span></div>
    <div class="actions">
      <button class="btn icon ghost wide-only" id="prevBtn" aria-label="Vorige foto"><svg viewBox="0 0 24 24"><path d="M14 7l-5 5 5 5"/></svg></button>
      <button class="btn icon ghost wide-only" id="nextBtn" aria-label="Volgende foto"><svg viewBox="0 0 24 24"><path d="M10 7l5 5-5 5"/></svg></button>
      <button class="btn icon ghost" id="undoBtn" aria-label="Ongedaan maken"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="btn icon ghost" id="redoBtn" aria-label="Opnieuw"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
      <button class="btn icon ghost" id="compareBtn" aria-label="Ingedrukt houden voor origineel" title="Ingedrukt houden voor het origineel (toets \)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg></button>
      <button class="btn icon ghost" id="moreBtn" aria-label="Meer opties"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
      <button class="btn primary" id="exportBtn"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span class="wide-only">Exporteren</span></button>
    </div>
    <div class="menu" id="menu" hidden>
      <button data-act="prev">Vorige foto</button>
      <button data-act="next">Volgende foto</button>
      <hr>
      <button data-act="copy">Instellingen kopiëren…</button>
      <button data-act="paste">Instellingen plakken</button>
      <hr>
      <button data-act="reset" class="danger-text">Alle bewerkingen herstellen</button>
    </div>
  </header>
  <div class="ed-main">
    <div class="stage" id="stage">
      <div class="wrap" id="wrap">
        <canvas id="gl"></canvas>
        <canvas id="ov"></canvas>
        <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="crop" id="cropBox" hidden>
          <span class="h" data-h="nw"></span><span class="h" data-h="ne"></span><span class="h" data-h="sw"></span><span class="h" data-h="se"></span>
          <span class="h" data-h="n"></span><span class="h" data-h="s"></span><span class="h" data-h="e"></span><span class="h" data-h="w"></span>
        </div>
      </div>
      <div class="badge" id="origBadge" hidden>Origineel</div>
      <div class="badge right" id="zoomBadge" hidden>100%</div>
      <div class="loading" id="loading" hidden>Laden…</div>
    </div>
    <aside class="side" id="side">
      <canvas id="histo" class="histo" width="512" height="128" aria-label="Histogram"></canvas>
      <div class="panel" id="panel"></div>
      <nav class="tools" id="tools" aria-label="Gereedschappen"></nav>
    </aside>
  </div>
</section>

<div class="dlg" id="dlg" hidden><div class="card" id="dlgCard" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
</body>
</html>
